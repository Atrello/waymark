<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f3a">
  <title>Sign in · Waymark</title>
  <script src="/theme.js"></script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="loginForm" novalidate>
      <div class="brand">
        <div class="logo">W</div>
        <div><b>Waymark</b><small>Personal mileage log</small></div>
      </div>
      <div id="loginMsg" class="msg bad" hidden></div>

      <!-- Step 1: username + password (or passkey) -->
      <div id="stepPassword">
        <div class="field">
          <label class="f" for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username webauthn" autocapitalize="none" spellcheck="false" required autofocus>
        </div>
        <div class="field">
          <label class="f" for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn primary" id="btnSignIn">Sign in</button>
        <div class="login-or" id="passkeyBox" hidden>
          <span>or</span>
          <button type="button" class="btn" id="btnPasskey">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="4"/><path d="M2 21c.6-3.5 3-5.5 6-5.5 1.3 0 2.5.4 3.4 1"/><path d="M17 11a3 3 0 1 0 0 .01M17 14v7l1.5-1.5L17 18"/></svg>
            Sign in with a passkey
          </button>
        </div>
      </div>

      <!-- Step 2: two-factor code (only if the user has turned it on) -->
      <div id="stepCode" hidden>
        <p class="hint mb10" id="codeHint">Enter the 6-digit code from your authenticator app.</p>
        <div class="field">
          <label class="f" for="code" id="codeLabel">Authentication code</label>
          <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" spellcheck="false" maxlength="20">
        </div>
        <label class="check mb16"><input type="checkbox" id="trustDevice"> Don't ask again on this device for 30 days</label>
        <button type="submit" class="btn primary" id="btnVerify">Verify</button>
        <div class="login-links">
          <button type="button" class="link-plain" id="btnUseBackup">Use a backup code instead</button>
          <button type="button" class="link-plain" id="btnBack">Back</button>
        </div>
      </div>
    </form>
  </div>
  <script src="/vendor/simplewebauthn.js"></script>
  <script src="/webauthn.js"></script>
  <script src="/login.js"></script>
</body>
</html>
